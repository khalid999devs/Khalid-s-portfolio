---
# Runs on Deploy HEAD Commit. cPanel joins these tasks into one bash script in
# the repository checkout, so an export carries forward to the next line.
#
# Nothing is built here -- deploy/ holds artefacts produced by
# scripts/build-deploy.sh and committed. See README for why.
deployment:
  tasks:
    - command -v rsync >/dev/null || { echo "rsync not on PATH"; exit 1; }

    # $HOME, not a literal path. The first attempt hardcoded the wrong account
    # name, rsync failed on a directory that does not exist, and the deploy
    # reported nothing at all -- the site simply stayed as it was.
    - export HOME_DIR="${HOME:-/home/yqvubgrbiy}"
    # No -p and no --chmod. Without -p rsync applies the receiving umask to the
    # source mode, so a git checkout lands at 644/755, which is what Apache
    # wants. --chmod would say the same thing while failing outright on the
    # openrsync that ships with current macOS.
    - export SYNC="rsync -rlt"
    - export WEB="$HOME_DIR/khalidahammed.com"
    - export UPWORK="$HOME_DIR/upwork.khalidahammed.com"
    - export API="$HOME_DIR/api.khalidahammed.com"

    # Fail loudly on a missing target rather than half-deploying. A wrong path
    # here is the difference between a broken site and an unchanged one, and
    # the unchanged one is much harder to notice.
    #
    # Quoted because the message once contained a colon and a space. YAML reads
    # that as "key: value", so cPanel's Perl parser turned the whole task into a
    # hash and wrote HASH(0x29a43c0) into the script. scripts/check-cpanel-yml.mjs
    # now fails the build on any task that does not parse as a plain string.
    - 'for d in "$WEB" "$UPWORK" "$API"; do test -d "$d" || { echo "missing target $d"; exit 1; }; done'

    - $SYNC deploy/web/ "$WEB/"
    - $SYNC deploy/upwork/ "$UPWORK/"

    # No --delete anywhere. On the client it would remove a hashed chunk that
    # an already-loaded page is about to request; on the server this directory
    # is not only ours -- node_modules is installed by cPanel, .env is managed
    # outside the repo, uploads/ and logs/ are live data, and Passenger writes
    # its own .htaccess here.
    # What the running app has, recorded before anything overwrites it.
    - 'LOCK_BEFORE=$(cksum "$API/package-lock.json" 2>/dev/null || echo none)'
    - 'MIGRATIONS_BEFORE=$(ls -1 "$API/migrations" 2>/dev/null | wc -l)'

    - $SYNC --exclude 'node_modules/' --exclude '.env' --exclude 'uploads/' --exclude 'logs/' --exclude '.htaccess' --exclude 'tmp/' server/ "$API/"

    - 'LOCK_AFTER=$(cksum "$API/package-lock.json" 2>/dev/null || echo none)'
    - 'MIGRATIONS_AFTER=$(ls -1 "$API/migrations" 2>/dev/null | wc -l)'

    # `; true` on both: cPanel aborts the deploy on any non-zero task, and a
    # failed [ ] test is non-zero.
    - 'NEEDS_INSTALL=0; [ "$LOCK_BEFORE" != "$LOCK_AFTER" ] && NEEDS_INSTALL=1; true'
    - 'NEEDS_MIGRATE=0; [ "$MIGRATIONS_AFTER" -gt "$MIGRATIONS_BEFORE" ] && NEEDS_MIGRATE=1; true'

    # LSAPI reloads when restart.txt changes -- but only restart into code the
    # installed dependencies can actually satisfy. Forcing it once already took
    # the API down with a 503, because new code met the old node_modules.
    # Leaving the old process up is the safer failure.
    - 'if [ "$NEEDS_INSTALL" = 1 ] || [ "$NEEDS_MIGRATE" = 1 ]; then echo "NOT RESTARTED -- lockfile changed=$NEEDS_INSTALL, new migrations=$NEEDS_MIGRATE"; echo "In Setup Node.js App run NPM Install and/or the migrate script, then press Restart."; else mkdir -p "$API/tmp" && touch "$API/tmp/restart.txt"; echo "api restarted"; fi'

    # Outside the repository on purpose: a file written into the checkout
    # leaves the tree dirty and the next Update from Remote refuses to run.
    - git rev-parse HEAD > "$HOME_DIR/last-deploy.txt"
    - echo "deployed $(git rev-parse --short HEAD) to $WEB, $UPWORK, $API"
