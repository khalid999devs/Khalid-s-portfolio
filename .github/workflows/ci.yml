name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Check server syntax
        run: npm run check:syntax --prefix server

      - name: Run server tests
        run: npm test --prefix server

      - name: Audit all server dependencies
        run: npm audit --prefix server --audit-level=low

  client:
    name: Client lint, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client

      - name: Test client
        run: npm test --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Audit all client dependencies
        run: npm audit --prefix client --audit-level=low
