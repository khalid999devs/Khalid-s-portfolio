name: CI

# Runs the checks that survive a clean checkout.
#
# The verification harness (visual regression, API contract, bundle budget) is
# not in this repository: it needs a frozen baseline worktree and a fixture set
# copied from production media, neither of which belongs in a public repo. It
# runs locally before anything is pushed, and it is the gate every change here
# has been through. README.md describes what it checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      # `npm ci` rather than `npm install`: it fails when the lockfile and
      # manifest disagree instead of quietly resolving something different.
      - run: npm ci
      - run: npm test

      # Production dependencies only. Tooling advisories are worth knowing about
      # but must not block a release for code that never ships.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Reject a committed .env
        run: |
          if git ls-files --error-unmatch server/.env >/dev/null 2>&1; then
            echo "server/.env is tracked; secrets must not be committed."
            exit 1
          fi
        working-directory: .

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The README was once saved as UTF-16. GitHub decoded it into a single
      # unreadable paragraph: every heading, list and diagram collapsed, and
      # nothing in the repository complained. A NUL byte in a file Git calls
      # text is the signature of that mistake, so it fails here instead.
      - name: Markdown must be UTF-8
        run: |
          set -euo pipefail
          rc=0
          for file in $(git ls-files '*.md'); do
            # Strip NUL bytes and compare with the original. A difference means
            # the file had them, which is what UTF-16 looks like to anything
            # expecting UTF-8. Portable, and unlike `grep -P` it cannot pass by
            # failing to run.
            if ! LC_ALL=C tr -d '\000' < "$file" | cmp -s - "$file"; then
              echo "$file contains NUL bytes; it is UTF-16, not UTF-8."
              echo "  fix: iconv -f UTF-16LE -t UTF-8 $file > tmp && mv tmp $file"
              rc=1
            fi
          done
          exit $rc

      # An unclosed fence swallows the rest of the page into a code block.
      - name: Code fences must be balanced
        run: |
          set -euo pipefail
          rc=0
          for file in $(git ls-files '*.md'); do
            count=$(grep -c '^```' "$file" || true)
            if [ $((count % 2)) -ne 0 ]; then
              echo "$file has $count fence markers; one is unclosed."
              rc=1
            fi
          done
          exit $rc

  client:
    name: Client
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # A floor under the performance work, without needing the harness. The
      # exact budget lives with the harness locally; this only catches the case
      # where the critical path grows by an order of magnitude, which is what a
      # bad chunking change looks like.
      - name: Critical bundle sanity
        run: |
          node -e "
            const { readFileSync, readdirSync } = require('fs');
            const { gzipSync } = require('zlib');
            const html = readFileSync('dist/index.html', 'utf8');
            const critical = new Set(
              [...html.matchAll(/(?:src|href)=\"\/assets\/([^\"]+)\"/g)].map((m) => m[1])
            );
            let bytes = 0;
            for (const file of readdirSync('dist/assets')) {
              if (file.endsWith('.js') && critical.has(file)) {
                bytes += gzipSync(readFileSync('dist/assets/' + file)).length;
              }
            }
            const kib = bytes / 1024;
            console.log('critical JS (gzip): ' + kib.toFixed(1) + ' KiB');
            if (kib > 300) {
              console.error('Critical path exceeded 300 KiB. Something is no longer code split.');
              process.exit(1);
            }
          "
