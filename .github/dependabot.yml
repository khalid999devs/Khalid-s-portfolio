version: 2

updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client-safe-updates:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-safe-updates:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
